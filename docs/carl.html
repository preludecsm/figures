   return a;
 }
 async function open_(pass){
   var km = await crypto.subtle.importKey(
     'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
   var key = await crypto.subtle.deriveKey(
     {name:'PBKDF2', salt: raw(P.salt), iterations: P.iter, hash:'SHA-256'},
     km, {name:'AES-GCM', length:256}, false, ['decrypt']);
   // AES-GCM authenticates: a wrong passphrase throws here rather than
   // yielding garbage, so this doubles as the password check.
   var buf = await crypto.subtle.decrypt(
     {name:'AES-GCM', iv: raw(P.iv)}, key, raw(P.ct));
   return new TextDecoder().decode(buf);
 }
 function show(html){
   document.open(); document.write(html); document.close();
 }
 async function attempt(pass, quiet){
   go.disabled = true;
   m.className = 'msg'; m.textContent = quiet ? 'Unlocking…' : 'Checking…';
   try {
     var html = await open_(pass);
     try { sessionStorage.setItem(KEY, pass); } catch(e){}
     show(html);
   } catch(e){
     try { sessionStorage.removeItem(KEY); } catch(_){}

     if (quiet){ m.textContent = ''; return; }
     m.className = 'msg err';
     m.textContent = 'That passphrase does not open this page.';

   }
 }
 f.addEventListener('submit', function(e){

   if (pw.value) attempt(pw.value, false);

 if (!window.crypto || !crypto.subtle){

   m.textContent = 'This browser cannot decrypt the page. Try Safari, Chrome or Firefox.';

 } else {
   var saved = null;
   try { saved = sessionStorage.getItem(KEY); } catch(e){}
   if (saved) attempt(saved, true);
 }
