<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Your figures</title>
<style>
:root{--bg:#12100e;--ink:#ece6dc;--muted:#a8a096;--edge:#2b2724;--gold:#c9a84a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
 color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 padding:24px}
.card{width:100%;max-width:26rem;border:1px solid var(--edge);border-radius:10px;padding:28px}
h1{font:600 1.18rem/1.3 Georgia,"Times New Roman",serif;margin:0 0 6px}
p{color:var(--muted);font-size:.9rem;margin:0 0 18px}
label{display:block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;
 color:var(--muted);margin-bottom:7px}
input{width:100%;padding:11px 12px;font-size:1rem;color:var(--ink);background:#1b1815;
 border:1px solid var(--edge);border-radius:6px}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:14px;padding:11px;font-size:.95rem;font-weight:600;
 color:#12100e;background:var(--gold);border:0;border-radius:6px;cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
.msg{min-height:1.3em;margin:12px 0 0;font-size:.85rem}
.err{color:#d98c7a}
@media (prefers-color-scheme:light){
 :root{--bg:#faf8f4;--ink:#231f1b;--muted:#6d655c;--edge:#ddd6ca}
 input{background:#fff}button{color:#fff;background:#8a6f1f}}
</style></head><body>

</div>

<script>
(function(){
 var P = JSON.parse(document.getElementById('payload').textContent);
 var KEY = 'cs-pass';
 var f = document.getElementById('f'), pw = document.getElementById('pw'),
     go = document.getElementById('go'), m = document.getElementById('m');
 function raw(b64){
   var s = atob(b64), a = new Uint8Array(s.length);
   for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
   return a;
 }
 async function open_(pass){
   var km = await crypto.subtle.importKey(
     'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
   var key = await crypto.subtle.deriveKey(
     {name:'PBKDF2', salt: raw(P.salt), iterations: P.iter, hash:'SHA-256'},
     km, {name:'AES-GCM', length:256}, false, ['decrypt']);
   // AES-GCM authenticates: a wrong passphrase throws here rather than
   // yielding garbage, so this doubles as the password check.
   var buf = await crypto.subtle.decrypt(
     {name:'AES-GCM', iv: raw(P.iv)}, key, raw(P.ct));
   return new TextDecoder().decode(buf);
 }
 function show(html){
   document.open(); document.write(html); document.close();
 }
 async function attempt(pass, quiet){
   go.disabled = true;
   m.className = 'msg'; m.textContent = quiet ? 'Unlocking…' : 'Checking…';
   try {
     var html = await open_(pass);
     try { sessionStorage.setItem(KEY, pass); } catch(e){}
     show(html);
   } catch(e){
     try { sessionStorage.removeItem(KEY); } catch(_){}
     go.disabled = false;
     if (quiet){ m.textContent = ''; return; }
     m.className = 'msg err';
     m.textContent = 'That passphrase does not open this page.';
     pw.select();
   }
 }
 f.addEventListener('submit', function(e){
   e.preventDefault();
   if (pw.value) attempt(pw.value, false);
 });
 if (!window.crypto || !crypto.subtle){
   m.className = 'msg err';
   m.textContent = 'This browser cannot decrypt the page. Try Safari, Chrome or Firefox.';
   go.disabled = true;
 } else {
   var saved = null;
   try { saved = sessionStorage.getItem(KEY); } catch(e){}
   if (saved) attempt(saved, true);
 }
})();
</script></body></html>
